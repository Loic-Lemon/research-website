nd Informatics at <strong>Cardiff University</strong> + <a href="https://www.agilecps.org/" target="_blank" rel="noopener noreferrer"><strong>AGILE Lab</strong></a>.</p>
  <ul style="margin:12px 0;padding-left:1.25rem;list-style:disc">
    <li style="margin:0 0 8px">I completed a <strong>BSc in Computer Science</strong> at Cardiff University in 2024, graduating with <strong>First Class Honours</strong>. My dissertation received the <strong>Best Undergraduate Dissertation award</strong> in CompSci.</li>
    <li style="margin:0 0 8px">I completed an <strong>MPhil</strong> with Dr Amir Javed, researching <strong>machine-learning methods for intrusion detection in vehicles</strong>. I completed my Viva with <strong>no corrections</strong>.</li>
    <li style="color:rgb(var(--accent))">I am now pursuing a <strong>PhD</strong> under the supervision of Dr Nick Pham.</li>
  </ul>
  </div></section><section id="my-research" aria-labelledby="my-research-heading"><h2 id="my-research-heading" class="font-serif font-bold text-xl mb-8 tracking-wide uppercase border-b border-foreground">My Research</h2><div class="text-base leading-relaxed text-foreground/90 [&amp;_a]:underline [&amp;_a]:text-foreground [&amp;_a:hover]:text-muted"><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
  <p style="margin-top:12px">Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p></div><figure class="mt-6"><img alt="Loic as a cartoon caveman being chased by a saber-toothed tiger" width="1920" height="1080" decoding="async" data-nimg="1" class="h-auto w-full rounded-xl" style="color:transparent" data-demo-image="image-3"><figcaption class="text-center text-sm text-muted mt-1 italic">Image: Depiction of when stress helped us survive life or death situations.</figcaption></figure><p class="mt-6 text-base leading-relaxed text-foreground/90">Even though there is a focus on stress and seizures, the systems and methodologies presented in my work can be considered universal to other biosignal systems. I hope that the research can contribute towards healthcare companies that improve quality of life.</p></section><section id="recent-highlights"><h2 class="font-serif font-bold text-xl mb-8 tracking-wide uppercase border-b border-foreground" id="_R_3eatmlb_-0">Recent Highlights</h2><div class="space-y-6 [&amp;&gt;*+*]:item-separator [&amp;&gt;*+*]:pt-6"><div><div class="mb-2 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-award text-muted shrink-0"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"></path><circle cx="12" cy="8" r="6"></circle></svg><span class="text-sm font-semibold text-accent uppercase tracking-wider">May 2026</span><span class="text-sm text-muted"><span class="text-muted"> · </span>Award</span></div><h3 class="text-base font-medium text-foreground mb-2"><a href="https://www.sigmobile.org/mobisys/2026/asset/" target="_blank" rel="noopener noreferrer" class="group inline-flex items-center gap-2 hover:text-foreground transition-colors duration-300">ASSET'26 and Mobisys Scholarship 🎓<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform duration-300"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></h3><p class="text-sm text-muted leading-relaxed mb-3 [&amp;_a]:underline [&amp;_a]:text-foreground [&amp;_a:hover]:text-muted">I have been accepted into the ASSET'26 Symposium @ ACM Mobisys 2026. Through this, I have achieved a scholarship to attend the conference in Cambridge.</p></div><div><div class="mb-2 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text text-muted shrink-0"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span class="text-sm font-semibold text-accent uppercase tracking-wider">April 2026</span><span class="text-sm text-muted"><span class="text-muted"> · </span>Publication</span></div><h3 class="text-base font-medium text-foreground mb-2">Workshop Paper @ Mobisys'26 📄</h3><p class="text-sm text-muted leading-relaxed mb-3 [&amp;_a]:underline [&amp;_a]:text-foreground [&amp;_a:hover]:text-muted">My paper 'PERSE: A PERsonalised SEizure prediction system based on large-scale EEG foundation model' has been accepted to a Mobisys workshop (EIFCOM)!</p></div><div><div class="mb-2 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="cu // Preview state only. No app files, storage, or server data are changed.
const site = document.getElementById('demo-site');
const toolbar = document.getElementById('demo-toolbar');
const caption = document.getElementById('demo-caption');
const variants = ['before', 'consistent', 'single'];
const descriptions = {
  before: 'Previous Demo Styling',
  consistent: 'One Item Font · 16px Titles And Text · 14px Metadata',
  single: 'Source Sans 3 Throughout · Same Consistent Items',
};
const initial = new URLSearchParams(location.search);
let variant = variants.includes(initial.get('variant')) ? initial.get('variant') : 'consistent';
let page = initial.get('page') || 'highlights';
function setVariant(next, updateUrl = true) {
  variant = next;
  site.dataset.variant = next;
  toolbar.querySelectorAll('[data-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === next)));
  caption.textContent = descriptions[next];
  if (updateUrl) syncUrl();
}
function syncUrl() {
  try {
    const url = new URL(location.href);
    url.searchParams.set('variant', variant);
    url.searchParams.set('page', page);
    history.replaceState(null, '', url);
  } catch (_) { /* srcdoc previews do not have a writable URL. */ }
}
function showPage(next, scroll = true) {
  const template = document.getElementById('page-' + (next === 'highlights' ? 'start' : next));
  if (!template) return;
  page = next;
  const previousMain = site.querySelector('main');
  const nextMain = template.content.firstElementChild.cloneNode(true);
  nextMain.querySelectorAll('img[data-demo-image]').forEach(img => { img.src = demoImages[img.dataset.demoImage]; });
  if (next === 'highlights') {
    nextMain.querySelectorAll('#about, #my-research, nav[aria-label="On this page"]').forEach(element => element.remove());
    nextMain.querySelector('section#recent-highlights').style.scrollMarginTop = '80px';
  }
  nextMain.querySelectorAll('#recent-highlights h3, #research h3, #publications h3, #timeline h3, #awards h3').forEach(title => {
    const item = title.parentElement;
    item.classList.add('demo-item');
    title.classList.add('demo-item-title');
    title.previousElementSibling?.classList.add('demo-item-meta');
    item.querySelectorAll(':scope > p, :scope > ul').forEach(body => body.classList.add('demo-item-body'));
    if (title.closest('#publications')) {
      const authors = item.querySelector(':scope > p');
      authors?.classList.replace('demo-item-body', 'demo-item-meta');
    }
    if (title.closest('#timeline')) item.previousElementSibling?.classList.add('demo-item-meta');
  });
  previousMain.replaceWith(nextMain);
  updateThemeLabels();
  setVariant(variant, false);
  syncUrl();
  if (scroll) window.scrollTo({ top: 0 });
}
toolbar.addEventListener('click', event => {
  const choice = event.target.closest('[data-choice]');
  if (choice) setVariant(choice.dataset.choice);
  const direction = event.target.closest('[data-direction]');
  if (direction) setVariant(variants[(variants.indexOf(variant) + Number(direction.dataset.direction) + variants.length) % variants.length]);
});
document.addEventListener('keydown', event => {
  if (event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    const delta = event.key === 'ArrowRight' ? 1 : -1;
    setVariant(variants[(variants.indexOf(variant) + delta + variants.length) % variants.length]);
  }
});
site.addEventListener('click', event => {
  const menu = event.target.closest('.menu-toggle');
  if (menu) {
    const header = menu.closest('.site-nav');
    const open = header.dataset.open !== 'true';
    header.dataset.open = String(open);
    menu.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-label', open ? 'Close quick links' : 'Open quick links');
    menu.lastElementChild.textContent = open ? 'Close' : 'Menu';
    return;
  }
  const nav = event.target.closest('#quick-links button');
  if (nav) {
    const pages = { Start: 'start', Research: 'research', Publications: 'publications', Timeline: 'timeline', Awards: 'awards', Extra: 'extra' };
    showPage(pages[nav.textContent.trim()]);
    return;
  }
  const theme = event.target.closest('button[aria-label^="Switch to"]');
  if (theme) {
    document.documentElement.classList.toggle('dark');
    updateThemeLabels();
    return;
  }
  const contents = event.target.closest('nav[aria-label="On this page"] button');
  if (contents) {
    const links = document.getElementById(contents.getAttribute('aria-controls'));
    if (links) {
      const expanded = contents.getAttribute('aria-expanded') !== 'true';
      contents.setAttribute('aria-expanded', String(expanded));
      links.style.display = expanded ? 'flex' : 'none';
    }
    return;
  }
  const preview = event.target.closest('button[aria-label*="image preview"]');
  if (preview) {
    const img = preview.querySelector('img');
    if (!img) return;
    let enlarged = preview.parentElement.querySelector('.demo-image-preview');
    if (enlarged) { enlarged.remove(); preview.setAttribute('aria-expanded', 'false'); }
    else {
      enlarged = document.createElement('div');
      enlarged.className = 'demo-image-preview';
      enlarged.style.cssText = 'flex-basis:100%;width:100%;padding:16px;border:1px solid rgb(var(--border));border-radius:12px';
      const full = img.cloneNode();
      full.style.cssText = 'position:static;width:100%;height:auto;max-height:600px;object-fit:contain';
      full.alt = preview.getAttribute('aria-label');
      enlarged.append(full);
      preview.parentElement.append(enlarged);
      preview.setAttribute('aria-expanded', 'true');
    }
    return;
  }
  const project = event.target.closest('a[href^="/research/"]');
  if (project) {
    event.preventDefault();
    const toast = document.getElementById('demo-toast');
    toast.textContent = 'Typography preview — project detail pages are unchanged.';
    toast.hidden = false;
    setTimeout(() => { toast.hidden = true; }, 2500);
  }
});
function updateThemeLabels() {
  site.querySelectorAll('button[aria-label^="Switch to"]').forEach(button => {
    button.setAttribute('aria-label', document.documentElement.classList.contains('dark') ? 'Switch to light mode' : 'Switch to dark mode');
  });
}
showPage(page, false);
setVariant(variant, false);
document.fonts.ready.then(() => console.log(JSON.stringify({
  variant,
  page,
  headingFont: getComputedStyle(site.querySelector('h1')).fontFamily,
  bodyFont: getComputedStyle(site).fontFamily,
  portraitFilter: Boolean(site.querySelector('#ink-bleed animate')),
  navigationPages: document.querySelectorAll('template[id^="page-"]').length,
  horizontalOverflow: document.documentElement.scrollWidth > innerWidth
})));
</script></body></html>
