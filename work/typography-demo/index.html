/* Throwaway comparison. The original stylesheet and motion remain in every variant. */
html { scroll-behavior: smooth; }
body { margin: 0; padding: 0; background: transparent; }
#demo-site { min-height: 100%; padding-bottom: 108px; background: rgb(var(--background)); color: rgb(var(--foreground)); font-family: var(--font-geist-sans), system-ui, sans-serif; }
#demo-site main { min-height: 760px; }
#demo-site a { overflow-wrap: anywhere; }
#demo-site .site-nav { z-index: 50; }
#demo-site[data-variant="proposed"], #demo-site[data-variant="serif"] { font-family: Arial, Helvetica, sans-serif; }
#demo-site:not([data-variant="current"]) .font-sans { font-family: Arial, Helvetica, sans-serif; }
#demo-site:not([data-variant="current"]) .font-serif { font-family: Georgia, "Times New Roman", serif; }
#demo-site:not([data-variant="current"]) h1 { font-family: Georgia, "Times New Roman", serif; font-size: 34px; line-height: 1.16; font-weight: 400; letter-spacing: 0; }
#demo-site:not([data-variant="current"]) h1 ~ p.uppercase { text-transform: none; letter-spacing: 0; font-size: 14px; }
#demo-site:not([data-variant="current"]) h1 + p { opacity: 1; color: rgb(var(--muted)); font-size: 13px; }
#demo-site:not([data-variant="current"]) h2 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; line-height: 1.25; font-weight: 400; letter-spacing: 0; text-transform: none; border-color: rgb(var(--border)); padding-bottom: 8px; margin-bottom: 24px; }
#demo-site:not([data-variant="current"]) .site-nav nav button { font-style: normal; font-size: 15px; }
#demo-site:not([data-variant="current"]) #about > div,
#demo-site:not([data-variant="current"]) #my-research > div,
#demo-site:not([data-variant="current"]) #my-research > p { font-size: 17px; line-height: 1.65; }
#demo-site:not([data-variant="current"]) #about strong { font-weight: 400; }
#demo-site:not([data-variant="current"]) #about > div > p > strong:first-child,
#demo-site:not([data-variant="current"]) #about a strong { font-weight: 600; }
#demo-site:not([data-variant="current"]) #about li[style] { color: inherit !important; }
#demo-site:not([data-variant="current"]) #about a,
#demo-site:not([data-variant="current"]) section p a { color: rgb(var(--accent)); text-decoration-thickness: 1px; text-underline-offset: 3px; }
#demo-site:not([data-variant="current"]) #recent-highlights .tracking-wider,
#demo-site:not([data-variant="current"]) #publications .tracking-wider { letter-spacing: 0; text-transform: none; color: rgb(var(--muted)); font-weight: 400; }
#demo-site:not([data-variant="current"]) #publications h3,
#demo-site:not([data-variant="current"]) #research h3 { font-family: Georgia, "Times New Roman", serif; font-size: 19px; line-height: 1.4; font-weight: 400; }
#demo-site:not([data-variant="current"]) #recent-highlights p { font-size: 15px; line-height: 1.6; }
#demo-site:not([data-variant="current"]) figcaption { font-size: 14px; line-height: 1.5; }
#demo-site:not([data-variant="current"]) .opacity-30,
#demo-site:not([data-variant="current"]) .opacity-35 { opacity: 1; }
#demo-site[data-variant="serif"] #about > div,
#demo-site[data-variant="serif"] #my-research > div,
#demo-site[data-variant="serif"] #my-research > p,
#demo-site[data-variant="serif"] section > div > div > p,
#demo-site[data-variant="serif"] #recent-highlights p { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.65; }
#demo-toolbar { position: fixed; z-index: 100; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); padding: 10px 12px; border: 1px solid #d4d4d4; border-radius: 12px; background: #fff; color: #242424; box-shadow: 0 5px 28px #0002; font: 13px/1.35 Arial, Helvetica, sans-serif; }
#demo-toolbar .demo-options { display: flex; align-items: center; gap: 4px; }
#demo-toolbar button { border: 0; border-radius: 5px; background: transparent; color: #505050; padding: 8px 12px; white-space: nowrap; font: inherit; cursor: pointer; }
#demo-toolbar button[aria-pressed="true"] { background: #252525; color: #fff; }
#demo-toolbar button:hover { background: #eee; color: #222; }
#demo-toolbar button[aria-pressed="true"]:hover { background: #252525; color: #fff; }
#demo-toolbar button:focus-visible { outline: 2px solid #194bd2; outline-offset: 2px; }

 Informatics at <strong>Cardiff University</strong> + <a href="https://www.agilecps.org/" target="_blank" rel="noopener noreferrer"><strong>AGILE Lab</strong></a>.</p>
  <ul style="margin:12px 0;padding-left:1.25rem;list-style:disc">
    <li style="margin:0 0 8px">I completed a <strong>BSc in Computer Science</strong> at Cardiff University in 2024, graduating with <strong>First Class Honours</strong>. My dissertation received the <strong>Best Undergraduate Dissertation award</strong> in CompSci.</li>
    <li style="margin:0 0 8px">I completed an <strong>MPhil</strong> with Dr Amir Javed, researching <strong>machine-learning methods for intrusion detection in vehicles</strong>. I completed my Viva with <strong>no corrections</strong>.</li>
    <li style="color:rgb(var(--accent))">I am now pursuing a <strong>PhD</strong> under the supervision of Dr Nick Pham.</li>
  </ul>

  <p style="margin-top:12px">Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p></div><figure class="mt-6"><img alt="Loic as a cartoon caveman being chased by a saber-toothed tiger" width="1920" height="1080" decoding="async" data-nimg="1" class="h-auto w-full rounded-xl" style="color:transparent" data-demo-image="image-3"><figcaption class="text-center text-sm text-muted mt-1 italic">Image: Depiction of when stress helped us survive life or death situations.</figcaption></figure><p class="mt-6 text-base leading-relaxed text-foreground/90">Even though there is a focus on stress and seizures, the systems and methodologies presented in my work can be considered universal to other biosignal systems. I hope that the research can contribute towards healthcare companies that improve quality of life.</p></section><section id="recent-highlights"><h2 class="font-serif font-bold text-xl mb-8 tracking-wide uppercase border-b border-foreground" id="_R_3eatmlb_-0">Recent Highlights</h2><div class="space-y-6 [&amp;&gt;*+*]:item-separator [&amp;&gt;*+*]:pt-6"><div><div class="mb-2 flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-award text-muted shrink-0"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"></path><circle cx="12" cy="8" r="6"></circle></svg><span class="text-sm font-semibold text-accent uppercase tracking-wider">May 2026</span><span class="text-sm text-muted"><span class="text-muted"> · </span>Award</span></div><h3 class="text-base font-medium text-foreground mb-2"><a href="https://www.sigmobile.org/mobisys/2026/asset/" target="_blank" rel="noopener // Preview state only. No app files, storage, or server data are changed.
const site = document.getElementById('demo-site');
const toolbar = document.getElementById('demo-toolbar');
const caption = document.getElementById('demo-caption');
const variants = ['current', 'proposed', 'serif'];
const descriptions = {
  current: 'Current fonts and emphasis · Decorative motion preserved',
  proposed: 'Georgia headings + Arial body · Decorative motion preserved',
  serif: 'Georgia headings + Georgia body · Decorative motion preserved'
};
const initial = new URLSearchParams(location.search);
let variant = variants.includes(initial.get('variant')) ? initial.get('variant') : 'proposed';
let page = initial.get('page') || 'start';
const titleCase = { 'My Research': 'My research', 'Recent Highlights': 'Recent highlights' };
function setVariant(next, updateUrl = true) {
  variant = next;
  site.dataset.variant = next;
  toolbar.querySelectorAll('[data-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === next)));
  caption.textContent = descriptions[next];
  site.querySelectorAll('h2').forEach(heading => {
    if (!heading.dataset.original) heading.dataset.original = heading.textContent;
    heading.textContent = next === 'current' ? heading.dataset.original : titleCase[heading.dataset.original] || heading.dataset.original;
  });
  if (updateUrl) syncUrl();
}
function syncUrl() {
  try {
    const url = new URL(location.href);
    url.searchParams.set('variant', variant);
    url.searchParams.set('page', page);
    history.replaceState(null, '', url);
  } catch (_) { /* srcdoc previews do not have a writable URL. */ }
}
function showPage(next, scroll = true) {
  const template = document.getElementById('page-' + next);
  if (!template) return;
  page = next;
  const previousMain = site.querySelector('main');
  const nextMain = template.content.firstElementChild.cloneNode(true);
  nextMain.querySelectorAll('img[data-demo-image]').forEach(img => { img.src = demoImages[img.dataset.demoImage]; });
  previousMain.replaceWith(nextMain);
  updateThemeLabels();
  setVariant(variant, false);
  syncUrl();
  if (scroll) window.scrollTo({ top: 0 });
}
toolbar.addEventListener('click', event => {
  const choice = event.target.closest('[data-choice]');
  if (choice) setVariant(choice.dataset.choice);
  const direction = event.target.closest('[data-direction]');
  if (direction) setVariant(variants[(variants.indexOf(variant) + Number(direction.dataset.direction) + variants.length) % variants.length]);
});
document.addEventListener('keydown', event => {
  if (event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    const delta = event.key === 'ArrowRight' ? 1 : -1;
    setVariant(variants[(variants.indexOf(variant) + delta + variants.length) % variants.length]);
  }
});
site.addEventListener('click', event => {
  const menu = event.target.closest('.menu-toggle');
  if (menu) {
    const header = menu.closest('.site-nav');
    const open = header.dataset.open !== 'true';
    header.dataset.open = String(open);
    menu.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-label', open ? 'Close quick links' : 'Open quick links');
    menu.lastElementChild.textContent = open ? 'Close' : 'Menu';
    return;
  }
  const nav = event.target.closest('#quick-links button');
  if (nav) {
    const pages = { Start: 'start', Research: 'research', Publications: 'publications', Timeline: 'timeline', Awards: 'awards', Extra: 'extra' };
    showPage(pages[nav.textContent.trim()]);
    return;
  }
  const theme = event.target.closest('button[aria-label^="Switch to"]');
  if (theme) {
    document.documentElement.classList.toggle('dark');
    updateThemeLabels();
    return;
  }
  const contents = event.target.closest('nav[aria-label="On this page"] button');
  if (contents) {
    const links = document.getElementById(contents.getAttribute('aria-controls'));
    if (links) {
      const expanded = contents.getAttribute('aria-expanded') !== 'true';
      contents.setAttribute('aria-expanded', String(expanded));
      links.style.display = expanded ? 'flex' : 'none';
    }
    return;
  }
  const preview = event.target.closest('button[aria-label*="image preview"]');
  if (preview) {
    const img = preview.querySelector('img');
    if (!img) return;
    let enlarged = preview.parentElement.querySelector('.demo-image-preview');
    if (enlarged) { enlarged.remove(); preview.setAttribute('aria-expanded', 'false'); }
    else {
      enlarged = document.createElement('div');
      enlarged.className = 'demo-image-preview';
      enlarged.style.cssText = 'flex-basis:100%;width:100%;padding:16px;border:1px solid rgb(var(--border));border-radius:12px';
      const full = img.cloneNode();
      full.style.cssText = 'position:static;width:100%;height:auto;max-height:600px;object-fit:contain';
      full.alt = preview.getAttribute('aria-label');
      enlarged.append(full);
      preview.parentElement.append(enlarged);
      preview.setAttribute('aria-expanded', 'true');
    }
    return;
  }
  const project = event.target.closest('a[href^="/research/"]');
  if (project) {
    event.preventDefault();
    const toast = document.getElementById('demo-toast');
    toast.textContent = 'Typography preview — project detail pages are unchanged.';
    toast.hidden = false;
    setTimeout(() => { toast.hidden = true; }, 2500);
  }
});
function updateThemeLabels() {
  site.querySelectorAll('button[aria-label^="Switch to"]').forEach(button => {
    button.setAttribute('aria-label', document.documentElement.classList.contains('dark') ? 'Switch to light mode' : 'Switch to dark mode');
  });
}
showPage(page, false);
setVariant(variant, false);
document.fonts.ready.then(() => console.log(JSON.stringify({
  variant,
  page,
  headingFont: getComputedStyle(site.querySelector('h1')).fontFamily,
  bodyFont: getComputedStyle(site).fontFamily,
  portraitFilter: Boolean(site.querySelector('#ink-bleed animate')),
  navigationPages: document.querySelectorAll('template[id^="page-"]').length,
  horizontalOverflow: document.documentElement.scrollWidth > innerWidth
})));
</script></body></html>
